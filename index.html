<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>新莊國小 志工證 列印管理系統</title>
<style>
  body { font-family: "Microsoft JhengHei", sans-serif; background: #f2f5f7; margin: 0; padding: 20px; }
  h1 { text-align: center; color: #234; font-size: 20px; }
  .toolbar { text-align: center; margin-bottom: 16px; }
  .toolbar button {
    padding: 8px 16px; font-size: 14px; border: none; border-radius: 6px;
    background: #2f6f4f; color: #fff; cursor: pointer; margin: 0 4px;
  }
  table { width: 100%; max-width: 640px; margin: 0 auto; border-collapse: collapse; background: #fff; }
  th, td { border: 1px solid #ddd; padding: 8px; font-size: 14px; text-align: center; vertical-align: middle; }
  th { background: #34495e; color: #fff; }
  input, select { width: 100%; padding: 6px 4px; font-size: 14px; box-sizing: border-box; }
  .del-btn { margin: 2px; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; color: #fff; background: #c0392b; }
  .toolbar .save-all-btn { background: #2980b9; font-weight: bold; }
  .save-hint { text-align: center; font-size: 13px; color: #888; margin: -6px 0 14px; }
  .table-wrap { overflow-x: auto; }
  .filter-bar { max-width: 640px; margin: 0 auto 14px; text-align: center; }
  .filter-bar button {
    padding: 6px 14px; margin: 3px; border: 1px solid #ccc; border-radius: 20px;
    background: #fff; cursor: pointer; font-size: 13px; color: #333;
  }
  .filter-bar button.active { background: #2f6f4f; color: #fff; border-color: #2f6f4f; }
  .toolbar .settings-btn { background: #7d6608; }
  .settings-panel {
    max-width: 640px; margin: 0 auto 20px; background: #fff;
    border: 1px solid #ddd; border-radius: 8px; padding: 16px 20px;
  }
  .settings-panel h3 { margin: 0 0 12px; font-size: 15px; color: #234; }
  .settings-row {
    display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 14px;
  }
  .settings-row label { flex: 0 0 150px; text-align: right; color: #444; }
  .settings-row input { width: 100px; flex: none; }
  .settings-row .settings-desc { flex: 1; color: #999; font-size: 12px; }
  .settings-panel .save-settings-btn {
    background: #2980b9; color: #fff; border: none; padding: 8px 18px;
    border-radius: 6px; cursor: pointer; margin-top: 6px;
  }
  .lock-screen {
    position: fixed; inset: 0; background: #eef1f3;
    display: flex; align-items: center; justify-content: center;
  }
  .lock-box {
    background: #fff; padding: 32px; border-radius: 12px; width: 300px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.1); text-align: center;
  }
  .lock-box h1 { font-size: 19px; line-height: 1.5; color: #234; margin-bottom: 18px; }
  .lock-box input { width: 100%; padding: 10px; margin: 12px 0; box-sizing: border-box; font-size: 15px; }
  .lock-box button { width: 100%; padding: 10px; background: #2f6f4f; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
  .err { color: #c0392b; font-size: 13px; min-height: 18px; }
  .loading-box {
    text-align: center;
    color: #555;
    font-size: 14px;
    padding: 30px 0;
  }
  .spinner {
    display: inline-block;
    width: 24px; height: 24px;
    border: 4px solid #cdd7dc;
    border-top-color: #2f6f4f;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

  <div class="lock-screen" id="lockScreen">
    <div class="lock-box">
      <h1 style="margin-top:0;">新莊國小<br>志工證 列印管理系統</h1>
      <div>請輸入管理密碼</div>
      <input type="password" id="pwdInput" placeholder="密碼" />
      <button id="unlockBtn">確認</button>
      <div class="err" id="pwdErr"></div>
    </div>
  </div>

  <div id="mainContent" style="display:none;">
    <h1>新莊國小 志工證 列印管理系統</h1>
    <div class="toolbar">
      <button id="addBtn">新增志工</button>
      <button id="saveAllBtn" class="save-all-btn">總儲存</button>
      <button id="printSelectedBtn">列印所選</button>
      <button id="printAllBtn">列印全部</button>
      <button id="toggleSettingsBtn" class="settings-btn">卡片設定</button>
    </div>
    <div class="settings-panel" id="settingsPanel" style="display:none;">
      <h3>卡片設定(每年可以來這裡修改學年度)</h3>
      <div class="settings-row">
        <label>學年度文字</label>
        <input type="text" id="setYear" style="width:160px;" placeholder="例如:115學年度" />
        <span class="settings-desc">會印在卡片上,每年開學前記得改一次</span>
      </div>
      <div class="settings-row">
        <label>學校標題字級</label>
        <input type="number" id="setFontSchool" min="10" max="40" />
        <span class="settings-desc">px,越大字越大(校長要求的「標題大一點」)</span>
      </div>
      <div class="settings-row">
        <label>學年度字級</label>
        <input type="number" id="setFontYear" min="8" max="30" />
        <span class="settings-desc">px</span>
      </div>
      <div class="settings-row">
        <label>組別文字字級</label>
        <input type="number" id="setFontGroup" min="8" max="30" />
        <span class="settings-desc">px,例如「行政志工」四個字</span>
      </div>
      <div class="settings-row">
        <label>組別圖示大小</label>
        <input type="number" id="setFontIcon" min="16" max="60" />
        <span class="settings-desc">px,例如 📖 這個符號的大小</span>
      </div>
      <div class="settings-row">
        <label>姓名字級</label>
        <input type="number" id="setFontName" min="12" max="50" />
        <span class="settings-desc">px,姓名通常要最大最清楚</span>
      </div>
      <div style="text-align:center;">
        <button class="save-settings-btn" id="saveSettingsBtn">儲存設定</button>
      </div>
    </div>
    <div class="save-hint">改完姓名或組別後,記得按「總儲存」一次儲存全部</div>
    <div class="filter-bar" id="filterBar"></div>
    <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th style="width:36px;">序號</th>
          <th style="width:36px;"><input type="checkbox" id="checkAll" /></th>
          <th>姓名</th>
          <th>組別</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
    </div>
  </div>

  <script type="module">
    import { db, collection, getDocs, doc, getDoc, setDoc, deleteDoc } from "./firebase-config.js";

    const ADMIN_PASSWORD = "073411373";
    const groups = ["行政", "課輔", "導護", "醫護", "故事", "圖書"];

    const DEFAULT_SETTINGS = {
      schoolYear: "115學年度",
      fontSchool: 24,
      fontYear: 16,
      fontGroup: 18,
      fontIcon: 40,
      fontName: 32,
    };

    let allVolunteers = []; // { id, name, group }
    let currentFilter = "全部";

    document.getElementById("unlockBtn").addEventListener("click", () => {
      const input = document.getElementById("pwdInput").value;
      if (input === ADMIN_PASSWORD) {
        document.getElementById("lockScreen").style.display = "none";
        document.getElementById("mainContent").style.display = "block";
        buildFilterBar();
        loadVolunteers();
        loadSettings();
      } else {
        document.getElementById("pwdErr").textContent = "密碼錯誤";
      }
    });
    document.getElementById("pwdInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") document.getElementById("unlockBtn").click();
    });

    document.getElementById("toggleSettingsBtn").addEventListener("click", () => {
      const panel = document.getElementById("settingsPanel");
      panel.style.display = panel.style.display === "none" ? "block" : "none";
    });

    async function loadSettings() {
      let settings = { ...DEFAULT_SETTINGS };
      try {
        const snap = await getDoc(doc(db, "settings", "config"));
        if (snap.exists()) settings = { ...settings, ...snap.data() };
      } catch (err) {
        console.error("讀取設定失敗,使用預設值", err);
      }
      document.getElementById("setYear").value = settings.schoolYear;
      document.getElementById("setFontSchool").value = settings.fontSchool;
      document.getElementById("setFontYear").value = settings.fontYear;
      document.getElementById("setFontGroup").value = settings.fontGroup;
      document.getElementById("setFontIcon").value = settings.fontIcon;
      document.getElementById("setFontName").value = settings.fontName;
    }

    document.getElementById("saveSettingsBtn").addEventListener("click", async () => {
      const btn = document.getElementById("saveSettingsBtn");
      const originalText = btn.textContent;
      btn.disabled = true;
      btn.textContent = "儲存中...";
      try {
        const payload = {
          schoolYear: document.getElementById("setYear").value.trim() || DEFAULT_SETTINGS.schoolYear,
          fontSchool: Number(document.getElementById("setFontSchool").value) || DEFAULT_SETTINGS.fontSchool,
          fontYear: Number(document.getElementById("setFontYear").value) || DEFAULT_SETTINGS.fontYear,
          fontGroup: Number(document.getElementById("setFontGroup").value) || DEFAULT_SETTINGS.fontGroup,
          fontIcon: Number(document.getElementById("setFontIcon").value) || DEFAULT_SETTINGS.fontIcon,
          fontName: Number(document.getElementById("setFontName").value) || DEFAULT_SETTINGS.fontName,
        };
        await setDoc(doc(db, "settings", "config"), payload, { merge: true });
        alert("設定已儲存,下次列印會套用新設定");
      } catch (err) {
        console.error(err);
        alert("設定儲存失敗:" + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = originalText;
      }
    });

    function groupOptions(selected) {
      return groups
        .map((g) => `<option value="${g}" ${g === selected ? "selected" : ""}>${g}</option>`)
        .join("");
    }

    function buildFilterBar() {
      const bar = document.getElementById("filterBar");
      const options = ["全部", ...groups];
      bar.innerHTML = options
        .map((g) => `<button class="filter-btn ${g === currentFilter ? "active" : ""}" data-group="${g}">${g}</button>`)
        .join("");
      bar.querySelectorAll(".filter-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          currentFilter = btn.dataset.group;
          bar.querySelectorAll(".filter-btn").forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          renderTable();
        });
      });
    }

    async function loadVolunteers() {
      const tbody = document.getElementById("tableBody");
      tbody.innerHTML = `<tr><td colspan="5"><div class="loading-box"><div class="spinner"></div><div>資料讀取中,請稍候...</div></div></td></tr>`;
      const snap = await getDocs(collection(db, "volunteers"));
      allVolunteers = [];
      snap.forEach((docSnap) => {
        allVolunteers.push({ id: docSnap.id, ...docSnap.data() });
      });
      renderTable();
    }

    function renderTable() {
      const tbody = document.getElementById("tableBody");
      tbody.innerHTML = "";

      let list = allVolunteers.slice();
      if (currentFilter !== "全部") {
        list = list.filter((v) => v.group === currentFilter);
      }
      if (!list.length) {
        tbody.innerHTML = "<tr><td colspan='5'>目前沒有符合的志工資料</td></tr>";
        return;
      }
      list.forEach((v, i) => addRow(v.id, v, false, i + 1));
    }

    function addRow(id, data = {}, isNew = true, seq = null) {
      const tbody = document.getElementById("tableBody");
      const tr = document.createElement("tr");
      tr.dataset.id = id || "";

      tr.innerHTML = `
        <td>${seq !== null ? seq : ""}</td>
        <td>${!isNew ? `<input type="checkbox" class="rowCheck" />` : ""}</td>
        <td><input type="text" class="nameInput" value="${data.name || ""}" placeholder="姓名" /></td>
        <td><select class="groupInput">${groupOptions(data.group)}</select></td>
        <td>
          ${!isNew ? `<button class="del-btn">刪除</button>` : ""}
        </td>
      `;
      tbody.appendChild(tr);

      const delBtn = tr.querySelector(".del-btn");
      if (delBtn) {
        delBtn.addEventListener("click", async () => {
          if (!confirm(`確定要刪除「${data.name}」的資料嗎?`)) return;
          try {
            await deleteDoc(doc(db, "volunteers", id));
            tr.remove();
          } catch (err) {
            console.error(err);
            alert("刪除失敗:" + err.message);
          }
        });
      }
    }

    document.getElementById("addBtn").addEventListener("click", () => {
      addRow(null, {}, true);
    });

    document.getElementById("saveAllBtn").addEventListener("click", async () => {
      const saveBtn = document.getElementById("saveAllBtn");
      const rows = document.querySelectorAll("#tableBody tr");

      // 進入儲存中狀態:按鈕變灰、文字改變、不能重複按
      const originalText = saveBtn.textContent;
      saveBtn.disabled = true;
      saveBtn.textContent = "儲存中...請稍候";
      saveBtn.style.opacity = "0.6";
      saveBtn.style.cursor = "not-allowed";

      let successCount = 0;
      let failCount = 0;

      try {
        const tasks = [];
        for (const tr of rows) {
          const nameInput = tr.querySelector(".nameInput");
          const groupInput = tr.querySelector(".groupInput");
          if (!nameInput || !groupInput) continue; // 空表格提示列,跳過

          const name = nameInput.value.trim();
          if (!name) continue; // 空白列(還沒填姓名)就不存,不當錯誤

          const payload = { name, group: groupInput.value };
          const docId = tr.dataset.id || `${Date.now()}_${Math.random().toString(36).slice(2, 7)}`;

          tasks.push(
            setDoc(doc(db, "volunteers", docId), payload)
              .then(() => { successCount++; })
              .catch((err) => { console.error(err); failCount++; })
          );
        }

        await Promise.all(tasks);

        if (failCount) {
          alert(`儲存完成,成功 ${successCount} 筆,失敗 ${failCount} 筆`);
        } else {
          alert(`已儲存 ${successCount} 筆資料`);
        }
        loadVolunteers();
      } finally {
        // 還原按鈕狀態(loadVolunteers 會重畫表格,這裡是保險,避免例外時按鈕卡住)
        saveBtn.disabled = false;
        saveBtn.textContent = originalText;
        saveBtn.style.opacity = "1";
        saveBtn.style.cursor = "pointer";
      }
    });

    document.getElementById("checkAll").addEventListener("change", (e) => {
      document.querySelectorAll(".rowCheck").forEach((cb) => (cb.checked = e.target.checked));
    });

    document.getElementById("printSelectedBtn").addEventListener("click", () => {
      const ids = [];
      document.querySelectorAll("#tableBody tr").forEach((tr) => {
        const cb = tr.querySelector(".rowCheck");
        if (cb && cb.checked && tr.dataset.id) ids.push(tr.dataset.id);
      });
      if (!ids.length) {
        alert("請先勾選要列印的志工");
        return;
      }
      window.location.href = `print.html?ids=${encodeURIComponent(ids.join(","))}`;
    });

    document.getElementById("printAllBtn").addEventListener("click", () => {
      const ids = allVolunteers.map((v) => v.id);
      if (!ids.length) {
        alert("目前沒有志工資料");
        return;
      }
      window.location.href = `print.html?ids=${encodeURIComponent(ids.join(","))}`;
    });
  </script>
</body>
</html>
