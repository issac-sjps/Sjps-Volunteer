<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>列印志工貼紙</title>
<style>
  body { font-family: "Microsoft JhengHei", sans-serif; background: #f2f5f7; margin: 0; padding: 20px; }
  .toolbar { text-align: center; margin-bottom: 20px; }
  .toolbar button {
    padding: 10px 20px; font-size: 15px; border: none; border-radius: 6px;
    background: #2f6f4f; color: #fff; cursor: pointer; margin: 0 6px;
  }
  .toolbar .print-options {
    display: inline-flex; align-items: center; gap: 6px; margin: 0 10px;
    font-size: 14px; color: #333; background: #fff; padding: 6px 10px;
    border-radius: 6px; border: 1px solid #ccc; vertical-align: middle;
  }
  .toolbar .print-options input,
  .toolbar .print-options select { padding: 4px; font-size: 14px; }
  .toolbar .print-options input[type="number"] { width: 55px; }
  @page { size: A4; margin: 0; }

  .print-page {
    width: 210mm;
    height: 297mm;
    box-sizing: border-box;
    margin: 0 auto 20px;
    background: #fff;
    display: flex;
    flex-wrap: wrap;
    align-content: flex-start;
    justify-content: center;
    box-shadow: 0 0 6px rgba(0,0,0,0.15);
  }
  @media print {
    .print-page {
      margin: 0;
      box-shadow: none;
      page-break-after: always;
    }
    .print-page:last-child { page-break-after: auto; }
  }

  .sticker {
    position: relative;
    width: 85.6mm;
    height: 54mm;
    border: 1px solid #999;
    background-size: cover;
    background-position: center;
    text-align: center;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .sticker .school { color: #333; letter-spacing: 0.5px; font-weight: bold; }
  .sticker .icon { margin: 4px 0 8px; line-height: 1; }
  .sticker .group { color: #444; }
  .sticker .name { font-weight: bold; margin: 4px 0; color: #222; }

  /* 中間留白區,文字疊在插畫背景的空白處 */
  .sticker-content {
    position: relative;
    z-index: 1;
  }

  .sticker.bg-admin   { background-image: url("images/bg-admin.jpg"); }
  .sticker.bg-tutor    { background-image: url("images/bg-tutor.jpg"); }
  .sticker.bg-guard    { background-image: url("images/bg-guard.jpg"); }
  .sticker.bg-medical  { background-image: url("images/bg-medical.jpg"); }
  .sticker.bg-story    { background-image: url("images/bg-story.jpg"); }
  .sticker.bg-library  { background-image: url("images/bg-library.jpg"); }
  .sticker.bg-default  { background-color: #f7f7f7; border-color: #ccc; }

  /* 背面(持證須知)卡片 */
  .sticker.back-card {
    background: #fbfbfb;
    display: block;
    text-align: left;
    padding: 5mm 6mm;
    font-size: 10.5px;
    line-height: 1.55;
    color: #222;
  }
  .sticker.back-card .back-title {
    font-weight: bold;
    font-size: 12.5px;
    margin-bottom: 3mm;
  }
  .sticker.back-card ol {
    margin: 0 0 3mm;
    padding-left: 2.4em;
  }
  .sticker.back-card li { margin-bottom: 1mm; }
  .sticker.back-card .back-addr {
    font-size: 10px;
    color: #444;
    margin-top: 1mm;
    display: flex;
    justify-content: space-between;
  }

  .loading-box {
    text-align: center;
    color: #555;
    font-size: 15px;
    margin-top: 60px;
  }
  .spinner {
    display: inline-block;
    width: 28px; height: 28px;
    border: 4px solid #cdd7dc;
    border-top-color: #2f6f4f;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 10px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media print {
    .toolbar { display: none; }
    #backOffsetHint { display: none !important; }
    body { padding: 0; background: #fff; }
  }
</style>
</head>
<body>
  <div class="toolbar">
    <button onclick="window.print()">列印</button>
    <button onclick="window.location.href='index.html'">返回編輯頁</button>
    <span class="print-options">
      邊界(mm):
      <input type="number" id="marginInput" value="5" min="0" max="20" />
    </span>
    <span class="print-options" style="background:#eef7ee; border-color:#bcdcc0;">
      卡片尺寸:85.6×54mm(信用卡標準尺寸,可放入透明證件夾) · 每頁約 <b id="perPageInfo">--</b> 張
    </span>
    <span class="print-options" style="background:#fff7e6; border-color:#f0d9a0;">
      <label style="display:flex; align-items:center; gap:4px; cursor:pointer;">
        <input type="checkbox" id="backEnableInput" />
        加印背面(持證須知)
      </label>
    </span>
    <span class="print-options" id="backOffsetGroup" style="background:#eef2ff; border-color:#c3cdf0; display:none;">
      背面微調(mm):
      左右(+右 / -左)
      <input type="number" id="backOffsetXInput" value="0" step="0.5" style="width:55px;" title="正值：背面內容整體往右移；負值：往左移" />
      上下(+下 / -上)
      <input type="number" id="backOffsetYInput" value="0" step="0.5" style="width:55px;" title="正值：背面內容整體往下移；負值：往上移" />
    </span>
  </div>
  <div id="backOffsetHint" style="display:none; text-align:center; font-size:13px; color:#666; margin:-14px 0 16px;">
    對照剪下的前後兩張卡片：背面內容整體偏右 → 左右填「負值」拉回左邊；偏左 → 填「正值」拉回右邊；偏下 → 上下填「負值」；偏上 → 填「正值」。
  </div>
  <div id="content">
    <div class="loading-box">
      <div class="spinner"></div>
      <div>資料讀取中,請稍候...</div>
    </div>
  </div>

  <script type="module">
    import { db, doc, getDoc } from "./firebase-config.js";

    const SCHOOL_NAME = "高雄市左營區新莊國民小學";

    const DEFAULT_SETTINGS = {
      schoolYear: "115學年度",
      fontSchool: 18,
      fontYear: 18,
      fontGroup: 13,
      fontIcon: 30,
      fontName: 24,
    };

    // 卡片固定尺寸(信用卡標準尺寸,mm)
    const CARD_W_MM = 85.6;
    const CARD_H_MM = 54;
    const GAP_MM = 3;
    const PAGE_W_MM = 210;
    const PAGE_H_MM = 297;

    const groupIcons = {
      "行政": "🗂️", "課輔": "📖", "導護": "🚦",
      "醫護": "🩺", "故事": "🦉", "圖書": "📚",
    };

    const BACK_CARD_HTML = `
      <div class="back-title">持證須知:</div>
      <ol>
        <li>進入校園請務必配戴,以便核實身分。</li>
        <li>本證僅為身分識別證使用,不做其他任何用途。</li>
        <li>本證應妥為保管,不得租借他人使用。</li>
        <li>本證若遺失,請支付工本費用 100 元,重新補發。</li>
        <li>終止單位服務時,請將本證繳回註銷。</li>
        <li>拾獲本證時,煩請寄回本校輔導處。</li>
      </ol>
      <div class="back-addr"><span>地址:高雄市左營區自由三路一號</span><span>電話:(07)3411373</span></div>
    `;

    const groupColorClass = {
      "行政": "bg-admin", "課輔": "bg-tutor", "導護": "bg-guard",
      "醫護": "bg-medical", "故事": "bg-story", "圖書": "bg-library",
    };

    const params = new URLSearchParams(window.location.search);
    const idsParam = params.get("ids");
    const content = document.getElementById("content");

    let cachedVolunteers = []; // 只抓一次資料,調整版面時重複使用
    let settings = { ...DEFAULT_SETTINGS };

    if (!idsParam) {
      content.textContent = "沒有指定要列印的志工,請從編輯頁選擇後再進來";
    } else {
      const ids = idsParam.split(",").map((p) => p.trim()).filter(Boolean);
      init(ids);
    }

    async function init(ids) {
      const total = ids.length;
      let done = 0;

      const loadingBox = document.createElement("div");
      loadingBox.className = "loading-box";
      loadingBox.innerHTML = `<div class="spinner"></div><div id="progressText">正在讀取資料 (0/${total})...</div>`;
      content.innerHTML = "";
      content.appendChild(loadingBox);

      // 設定與志工資料同時平行讀取
      const [settingsResult, volunteerResults] = await Promise.all([
        getDoc(doc(db, "settings", "config")).catch(() => null),
        Promise.all(
          ids.map(async (id) => {
            const snap = await getDoc(doc(db, "volunteers", id));
            done++;
            const progressText = document.getElementById("progressText");
            if (progressText) progressText.textContent = `正在讀取資料 (${done}/${total})...`;
            return snap.exists() ? snap.data() : null;
          })
        ),
      ]);

      if (settingsResult && settingsResult.exists()) {
        settings = { ...settings, ...settingsResult.data() };
      }
      cachedVolunteers = volunteerResults.filter(Boolean);

      if (!cachedVolunteers.length) {
        content.textContent = "查無資料";
        return;
      }

      renderPages();

      document.getElementById("marginInput").addEventListener("change", renderPages);
      document.getElementById("backEnableInput").addEventListener("change", () => {
        const on = document.getElementById("backEnableInput").checked;
        document.getElementById("backOffsetGroup").style.display = on ? "inline-flex" : "none";
        document.getElementById("backOffsetHint").style.display = on ? "block" : "none";
        renderPages();
      });
      document.getElementById("backOffsetXInput").addEventListener("change", renderPages);
      document.getElementById("backOffsetYInput").addEventListener("change", renderPages);
    }

    function renderPages() {
      const marginMm = Number(document.getElementById("marginInput").value) || 0;

      const usableW = PAGE_W_MM - marginMm * 2;
      const usableH = PAGE_H_MM - marginMm * 2;
      const cols = Math.max(1, Math.floor((usableW + GAP_MM) / (CARD_W_MM + GAP_MM)));
      const rows = Math.max(1, Math.floor((usableH + GAP_MM) / (CARD_H_MM + GAP_MM)));
      const perPage = cols * rows;

      document.getElementById("perPageInfo").textContent = perPage;

      const backEnabled = document.getElementById("backEnableInput").checked;
      const backOffsetX = Number(document.getElementById("backOffsetXInput").value) || 0; // 正值=背面往右移
      const backOffsetY = Number(document.getElementById("backOffsetYInput").value) || 0; // 正值=背面往下移

      content.innerHTML = "";

      // 建立一張正面卡片
      function buildFrontCard(data) {
        const div = document.createElement("div");
        div.className = `sticker ${groupColorClass[data.group] || "bg-default"}`;
        div.innerHTML = `
          <div class="sticker-content">
            <div class="year" style="font-size:${settings.fontYear}px; color:#666;">${settings.schoolYear}</div>
            <div class="school" style="font-size:${settings.fontSchool}px;">${SCHOOL_NAME}</div>
            <div class="icon" style="font-size:${settings.fontIcon}px;">${groupIcons[data.group] || "🙂"}</div>
            <div class="group" style="font-size:${settings.fontGroup}px;">${data.group}志工</div>
            <div class="name" style="font-size:${settings.fontName}px;">${data.name}</div>
          </div>
        `;
        return div;
      }

      // 建立一張背面卡片(內容固定,都是持證須知)
      function buildBackCard() {
        const div = document.createElement("div");
        div.className = "sticker back-card";
        div.innerHTML = BACK_CARD_HTML;
        return div;
      }

      for (let i = 0; i < cachedVolunteers.length; i += perPage) {
        const chunk = cachedVolunteers.slice(i, i + perPage);

        const page = document.createElement("div");
        page.className = "print-page";
        page.style.padding = marginMm + "mm";
        page.style.gap = GAP_MM + "mm";

        chunk.forEach((data) => {
          page.appendChild(buildFrontCard(data));
        });

        content.appendChild(page);

        if (backEnabled) {
          const backPage = document.createElement("div");
          backPage.className = "print-page";
          // 用不對稱的 padding 讓整體內容往指定方向偏移,修正雙面列印的定位誤差
          const topPad = marginMm + backOffsetY;
          const bottomPad = marginMm - backOffsetY;
          const leftPad = marginMm + backOffsetX;
          const rightPad = marginMm - backOffsetX;
          backPage.style.padding = `${topPad}mm ${rightPad}mm ${bottomPad}mm ${leftPad}mm`;
          backPage.style.gap = GAP_MM + "mm";

          // 背面每一格內容都相同(都是持證須知),所以排列順序不影響對齊;
          // 真正重要的是「卡片張數」要跟這一頁正面完全一樣,
          // 這樣 flex-wrap 自動換行的位置(尤其最後一頁不滿整頁時)才會跟正面一致,
          // 剪下來每張背面才會準確對到對應的正面卡片。
          chunk.forEach(() => {
            backPage.appendChild(buildBackCard());
          });

          content.appendChild(backPage);
        }
      }
    }
  </script>
</body>
</html>
