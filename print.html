<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>列印志工貼紙</title>
<style>
  body { font-family: "Microsoft JhengHei", sans-serif; background: #f2f5f7; margin: 0; padding: 20px; }
  .toolbar { text-align: center; margin-bottom: 20px; }
  .toolbar button {
    padding: 10px 20px; font-size: 15px; border: none; border-radius: 6px;
    background: #2f6f4f; color: #fff; cursor: pointer; margin: 0 6px;
  }
  .sheet {
    max-width: 700px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
  .sticker {
    position: relative;
    border: 1px solid #999;
    border-radius: 10px;
    padding: 14px;
    background-size: cover;
    background-position: center;
    text-align: center;
    overflow: hidden;
    aspect-ratio: 16 / 8;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .sticker .school { font-size: 13px; color: #444; letter-spacing: 0.5px; }
  .sticker .icon { font-size: 28px; margin-top: 2px; }
  .sticker .group { font-size: 14px; color: #444; }
  .sticker .name { font-size: 24px; font-weight: bold; margin: 4px 0; color: #222; }

  /* 中間留白區,文字疊在插畫背景的空白處 */
  .sticker-content {
    position: relative;
    z-index: 1;
  }

  .sticker.bg-admin   { background-image: url("images/bg-admin.jpg"); }
  .sticker.bg-tutor    { background-image: url("images/bg-tutor.jpg"); }
  .sticker.bg-guard    { background-image: url("images/bg-guard.jpg"); }
  .sticker.bg-medical  { background-image: url("images/bg-medical.jpg"); }
  .sticker.bg-story    { background-image: url("images/bg-story.jpg"); }
  .sticker.bg-library  { background-image: url("images/bg-library.jpg"); }
  .sticker.bg-default  { background-color: #f7f7f7; border-color: #ccc; }

  .loading-box {
    text-align: center;
    color: #555;
    font-size: 15px;
    margin-top: 60px;
  }
  .spinner {
    display: inline-block;
    width: 28px; height: 28px;
    border: 4px solid #cdd7dc;
    border-top-color: #2f6f4f;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 10px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media print {
    .toolbar { display: none; }
    body { padding: 0; background: #fff; }
    .sticker { border-width: 1.5px; border-style: solid; break-inside: avoid; }
  }
</style>
</head>
<body>
  <div class="toolbar">
    <button onclick="window.print()">列印</button>
    <button onclick="window.location.href='index.html'">返回編輯頁</button>
  </div>
  <div id="content">
    <div class="loading-box">
      <div class="spinner"></div>
      <div>資料讀取中,請稍候...</div>
    </div>
  </div>

  <script type="module">
    import { db, doc, getDoc } from "./firebase-config.js";

    const SCHOOL_NAME = "高雄市左營區新莊國民小學";

    const groupIcons = {
      "行政": "🗂️", "課輔": "📖", "導護": "🚦",
      "醫護": "🩺", "故事": "🦉", "圖書": "📚",
    };

    const groupColorClass = {
      "行政": "bg-admin", "課輔": "bg-tutor", "導護": "bg-guard",
      "醫護": "bg-medical", "故事": "bg-story", "圖書": "bg-library",
    };

    const params = new URLSearchParams(window.location.search);
    const idsParam = params.get("ids");
    const content = document.getElementById("content");

    if (!idsParam) {
      content.textContent = "沒有指定要列印的志工,請從編輯頁選擇後再進來";
    } else {
      const ids = idsParam.split(",").map((p) => p.trim()).filter(Boolean);
      renderAll(ids);
    }

    async function renderAll(ids) {
      const total = ids.length;
      let done = 0;

      const loadingBox = document.createElement("div");
      loadingBox.className = "loading-box";
      loadingBox.innerHTML = `<div class="spinner"></div><div id="progressText">正在讀取資料 (0/${total})...</div>`;
      content.innerHTML = "";
      content.appendChild(loadingBox);

      // 平行讀取所有資料(不用一個個排隊等),速度快很多
      const results = await Promise.all(
        ids.map(async (id) => {
          const snap = await getDoc(doc(db, "volunteers", id));
          done++;
          const progressText = document.getElementById("progressText");
          if (progressText) progressText.textContent = `正在讀取資料 (${done}/${total})...`;
          return snap.exists() ? snap.data() : null;
        })
      );

      const sheet = document.createElement("div");
      sheet.className = "sheet";

      results.forEach((data) => {
        if (!data) return;
        const div = document.createElement("div");
        div.className = `sticker ${groupColorClass[data.group] || "bg-default"}`;
        div.innerHTML = `
          <div class="sticker-content">
            <div class="school">${SCHOOL_NAME}</div>
            <div class="icon">${groupIcons[data.group] || "🙂"}</div>
            <div class="group">${data.group}志工</div>
            <div class="name">${data.name}</div>
          </div>
        `;
        sheet.appendChild(div);
      });

      content.innerHTML = "";
      if (!sheet.children.length) {
        content.textContent = "查無資料";
      } else {
        content.appendChild(sheet);
      }
    }
  </script>
</body>
</html>
