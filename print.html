<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>列印志工貼紙</title>
<style>
  body { font-family: "Microsoft JhengHei", sans-serif; background: #f2f5f7; margin: 0; padding: 20px; }
  .toolbar { text-align: center; margin-bottom: 20px; }
  .toolbar button {
    padding: 10px 20px; font-size: 15px; border: none; border-radius: 6px;
    background: #2f6f4f; color: #fff; cursor: pointer; margin: 0 6px;
  }
  .person-block { max-width: 700px; margin: 0 auto 24px; }
  .person-title { font-size: 14px; color: #555; margin-bottom: 8px; text-align: center; }
  .sheet {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
  .sticker {
    border: 1px dashed #999;
    border-radius: 10px;
    padding: 14px;
    background: #fff;
    text-align: center;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .sticker .icon { font-size: 28px; }
  .sticker .group { font-size: 13px; color: #555; }
  .sticker .name { font-size: 22px; font-weight: bold; margin: 4px 0; }
  .sticker .period { font-size: 12px; color: #777; }

  /* 各組別淺色底色，讓卡片不再單調 */
  .sticker.bg-admin  { background: #eaf1ff; border-color: #a9c2ea; }
  .sticker.bg-tutor   { background: #fff6e0; border-color: #e6cf8a; }
  .sticker.bg-guard   { background: #ffe9e6; border-color: #e6a89f; }
  .sticker.bg-medical { background: #e8fbf0; border-color: #9fd6b5; }
  .sticker.bg-story   { background: #f3e9ff; border-color: #c7a8e8; }
  .sticker.bg-library { background: #e6f7ff; border-color: #9fcfe0; }
  .sticker.bg-default { background: #f5f5f5; border-color: #ccc; }

  @media print {
    .toolbar { display: none; }
    .person-title { display: none; }
    body { padding: 0; background: #fff; }
    .sticker { border-width: 1.5px; border-style: solid; break-inside: avoid; }
    .person-block { break-after: page; }
  }
</style>
</head>
<body>
  <div class="toolbar">
    <button onclick="window.print()">列印</button>
    <button onclick="window.location.href='admin.html'">返回編輯頁</button>
  </div>
  <div id="content">載入中...</div>

  <script type="module">
    import { db, doc, getDoc } from "./firebase-config.js";

    const groupIcons = {
      "行政": "🗂️", "課輔": "📖", "導護": "🚦",
      "醫護": "🩺", "故事": "🦉", "圖書": "📚",
    };

    // 各組別對應的淺色底色 class
    const groupColorClass = {
      "行政": "bg-admin", "課輔": "bg-tutor", "導護": "bg-guard",
      "醫護": "bg-medical", "故事": "bg-story", "圖書": "bg-library",
    };

    const params = new URLSearchParams(window.location.search);
    const phonesParam = params.get("phones");
    const qty = Math.max(1, parseInt(params.get("qty") || "1", 10));
    const content = document.getElementById("content");

    if (!phonesParam) {
      content.textContent = "沒有指定要列印的志工,請從編輯頁選擇後再進來";
    } else {
      const phones = phonesParam.split(",").map((p) => p.trim()).filter(Boolean);
      renderAll(phones);
    }

    async function renderAll(phones) {
      content.innerHTML = "";
      for (const phone of phones) {
        const snap = await getDoc(doc(db, "volunteers", phone));
        if (!snap.exists()) continue;
        const data = snap.data();

        const block = document.createElement("div");
        block.className = "person-block";
        block.innerHTML = `<div class="person-title">${data.name}(${phone})</div>`;

        const sheet = document.createElement("div");
        sheet.className = "sheet";
        for (let i = 0; i < qty; i++) {
          const div = document.createElement("div");
          div.className = `sticker ${groupColorClass[data.group] || "bg-default"}`;
          div.innerHTML = `
            <div class="icon">${groupIcons[data.group] || "🙂"}</div>
            <div class="group">${data.group}志工</div>
            <div class="name">${data.name}</div>
            <div class="period">${data.validFrom}-${data.validTo}</div>
          `;
          sheet.appendChild(div);
        }
        block.appendChild(sheet);
        content.appendChild(block);
      }
      if (!content.children.length) {
        content.textContent = "查無資料";
      }
    }
  </script>
</body>
</html>
