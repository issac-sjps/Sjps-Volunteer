<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>列印志工貼紙</title>
<style>
  body { font-family: "Microsoft JhengHei", sans-serif; background: #f2f5f7; margin: 0; padding: 20px; }
  .toolbar { text-align: center; margin-bottom: 20px; }
  .toolbar button {
    padding: 10px 20px; font-size: 15px; border: none; border-radius: 6px;
    background: #2f6f4f; color: #fff; cursor: pointer; margin: 0 6px;
  }
  .toolbar .print-options {
    display: inline-flex; align-items: center; gap: 6px; margin: 0 10px;
    font-size: 14px; color: #333; background: #fff; padding: 6px 10px;
    border-radius: 6px; border: 1px solid #ccc; vertical-align: middle;
  }
  .toolbar .print-options input,
  .toolbar .print-options select { padding: 4px; font-size: 14px; }
  .toolbar .print-options input[type="number"] { width: 55px; }
  @page { size: A4; margin: 0; }

  .print-page {
    width: 210mm;
    height: 297mm;
    box-sizing: border-box;
    margin: 0 auto 20px;
    background: #fff;
    display: flex;
    flex-wrap: wrap;
    align-content: flex-start;
    justify-content: center;
    box-shadow: 0 0 6px rgba(0,0,0,0.15);
  }
  @media print {
    .print-page {
      margin: 0;
      box-shadow: none;
      page-break-after: always;
    }
    .print-page:last-child { page-break-after: auto; }
  }

  .sticker {
    position: relative;
    width: 85.6mm;
    height: 54mm;
    border: 1px solid #999;
    background-size: cover;
    background-position: center;
    text-align: center;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .sticker .school { color: #333; letter-spacing: 0.5px; font-weight: bold; }
  .sticker .icon { margin: 4px 0 8px; line-height: 1; }
  .sticker .group { color: #444; }
  .sticker .name { font-weight: bold; margin: 4px 0; color: #222; }

  /* 中間留白區,文字疊在插畫背景的空白處 */
  .sticker-content {
    position: relative;
    z-index: 1;
  }

  .sticker.bg-admin   { background-image: url("images/bg-admin.jpg"); }
  .sticker.bg-tutor    { background-image: url("images/bg-tutor.jpg"); }
  .sticker.bg-guard    { background-image: url("images/bg-guard.jpg"); }
  .sticker.bg-medical  { background-image: url("images/bg-medical.jpg"); }
  .sticker.bg-story    { background-image: url("images/bg-story.jpg"); }
  .sticker.bg-library  { background-image: url("images/bg-library.jpg"); }
  .sticker.bg-default  { background-color: #f7f7f7; border-color: #ccc; }

  .loading-box {
    text-align: center;
    color: #555;
    font-size: 15px;
    margin-top: 60px;
  }
  .spinner {
    display: inline-block;
    width: 28px; height: 28px;
    border: 4px solid #cdd7dc;
    border-top-color: #2f6f4f;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 10px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media print {
    .toolbar { display: none; }
    body { padding: 0; background: #fff; }
  }
</style>
</head>
<body>
  <div class="toolbar">
    <button onclick="window.print()">列印</button>
    <button onclick="window.location.href='index.html'">返回編輯頁</button>
    <span class="print-options">
      邊界(mm):
      <input type="number" id="marginInput" value="5" min="0" max="20" />
    </span>
    <span class="print-options" style="background:#eef7ee; border-color:#bcdcc0;">
      卡片尺寸:85.6×54mm(信用卡標準尺寸,可放入透明證件夾) · 每頁約 <b id="perPageInfo">--</b> 張
    </span>
  </div>
  <div id="content">
    <div class="loading-box">
      <div class="spinner"></div>
      <div>資料讀取中,請稍候...</div>
    </div>
  </div>

  <script type="module">
    import { db, doc, getDoc } from "./firebase-config.js";

    const SCHOOL_NAME = "高雄市左營區新莊國民小學";

    const DEFAULT_SETTINGS = {
      schoolYear: "115學年度",
      fontSchool: 18,
      fontYear: 11,
      fontGroup: 13,
      fontIcon: 30,
      fontName: 24,
    };

    // 卡片固定尺寸(信用卡標準尺寸,mm)
    const CARD_W_MM = 85.6;
    const CARD_H_MM = 54;
    const GAP_MM = 3;
    const PAGE_W_MM = 210;
    const PAGE_H_MM = 297;

    const groupIcons = {
      "行政": "🗂️", "課輔": "📖", "導護": "🚦",
      "醫護": "🩺", "故事": "🦉", "圖書": "📚",
    };

    const groupColorClass = {
      "行政": "bg-admin", "課輔": "bg-tutor", "導護": "bg-guard",
      "醫護": "bg-medical", "故事": "bg-story", "圖書": "bg-library",
    };

    const params = new URLSearchParams(window.location.search);
    const idsParam = params.get("ids");
    const content = document.getElementById("content");

    let cachedVolunteers = []; // 只抓一次資料,調整版面時重複使用
    let settings = { ...DEFAULT_SETTINGS };

    if (!idsParam) {
      content.textContent = "沒有指定要列印的志工,請從編輯頁選擇後再進來";
    } else {
      const ids = idsParam.split(",").map((p) => p.trim()).filter(Boolean);
      init(ids);
    }

    async function init(ids) {
      const total = ids.length;
      let done = 0;

      const loadingBox = document.createElement("div");
      loadingBox.className = "loading-box";
      loadingBox.innerHTML = `<div class="spinner"></div><div id="progressText">正在讀取資料 (0/${total})...</div>`;
      content.innerHTML = "";
      content.appendChild(loadingBox);

      // 設定與志工資料同時平行讀取
      const [settingsResult, volunteerResults] = await Promise.all([
        getDoc(doc(db, "settings", "config")).catch(() => null),
        Promise.all(
          ids.map(async (id) => {
            const snap = await getDoc(doc(db, "volunteers", id));
            done++;
            const progressText = document.getElementById("progressText");
            if (progressText) progressText.textContent = `正在讀取資料 (${done}/${total})...`;
            return snap.exists() ? snap.data() : null;
          })
        ),
      ]);

      if (settingsResult && settingsResult.exists()) {
        settings = { ...settings, ...settingsResult.data() };
      }
      cachedVolunteers = volunteerResults.filter(Boolean);

      if (!cachedVolunteers.length) {
        content.textContent = "查無資料";
        return;
      }

      renderPages();

      document.getElementById("marginInput").addEventListener("change", renderPages);
    }

    function renderPages() {
      const marginMm = Number(document.getElementById("marginInput").value) || 0;

      const usableW = PAGE_W_MM - marginMm * 2;
      const usableH = PAGE_H_MM - marginMm * 2;
      const cols = Math.max(1, Math.floor((usableW + GAP_MM) / (CARD_W_MM + GAP_MM)));
      const rows = Math.max(1, Math.floor((usableH + GAP_MM) / (CARD_H_MM + GAP_MM)));
      const perPage = cols * rows;

      document.getElementById("perPageInfo").textContent = perPage;

      content.innerHTML = "";

      for (let i = 0; i < cachedVolunteers.length; i += perPage) {
        const chunk = cachedVolunteers.slice(i, i + perPage);

        const page = document.createElement("div");
        page.className = "print-page";
        page.style.padding = marginMm + "mm";
        page.style.gap = GAP_MM + "mm";

        chunk.forEach((data) => {
          const div = document.createElement("div");
          div.className = `sticker ${groupColorClass[data.group] || "bg-default"}`;
          div.innerHTML = `
            <div class="sticker-content">
              <div class="year" style="font-size:${settings.fontYear}px; color:#666;">${settings.schoolYear}</div>
              <div class="school" style="font-size:${settings.fontSchool}px;">${SCHOOL_NAME}</div>
              <div class="icon" style="font-size:${settings.fontIcon}px;">${groupIcons[data.group] || "🙂"}</div>
              <div class="group" style="font-size:${settings.fontGroup}px;">${data.group}志工</div>
              <div class="name" style="font-size:${settings.fontName}px;">${data.name}</div>
            </div>
          `;
          page.appendChild(div);
        });

        content.appendChild(page);
      }
    }
  </script>
</body>
</html>
